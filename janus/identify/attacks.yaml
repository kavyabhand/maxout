- id: D14
  category: D
  category_name: "Agentic Commerce Fraud"
  name: "Prompt-Injection Hijack of Shopping Agents"
  mechanism: >
    Malicious content embedded in a merchant's own product listing
    covertly instructs a consumer's AI shopping agent to change its
    selection, quantity, stated price, or the account a payment
    instrument is requested against, while the resulting checkout stays
    cryptographically valid under AP2/UCP (execution integrity preserved,
    reasoning integrity broken). The umbrella mechanism for D14-D17 below;
    branded_whisper/cart_inflation/currency_locale_confusion/vault_whisper
    are its four concretely implemented variants in this repo.
  rails: [agentic_token]
  channels: [ap2_ucp_sandbox]
  actors: [fraud_ring, malicious_merchant]
  precursor_signals: ["catalog text classified high-risk by the injection-text classifier", "checkout that violates the Open Checkout Mandate's own constraints"]
  observable_features: ["content-classifier score", "maximal-flow line-item constraint satisfaction", "purchase-summary/total amount match"]
  atlas_mapping: "AML.T0051 (indirect prompt injection)"
  status: simulated
  grounding: ["arXiv:2601.22569, \"Whispers of Wealth\" (Jan 2026), 100% indirect-injection success against a working AP2 shopping agent, reproduced here at 100% against a naive baseline"]
  simulated_by:
    - "janus.generate.agentic.red_team (branded_whisper, cart_inflation, currency_locale_confusion, vault_whisper)"
  detected_by:
    - "janus.defend.firewall.MandateFirewall (hard_rules + nlp.InjectionTextClassifier)"

- id: D15
  category: D
  category_name: "Agentic Commerce Fraud"
  name: "Synthetic / Impersonated Agent Identity"
  mechanism: >
    A fraudulent agent impersonates a legitimate merchant or consumer
    agent inside an agent-to-agent negotiation to initiate an
    unauthorized transaction, exploiting the fact that AP2's Merchant
    object (id/name/website) is self-reported with no PKI binding to a
    verified domain/certificate.
  rails: [agentic_token]
  channels: [a2a_negotiation]
  actors: [fraud_ring]
  precursor_signals: ["merchant identity in a checkout_jwt not present in the mandate's allowed_merchants set"]
  observable_features: ["merchant_allowed hard-rule verdict"]
  atlas_mapping: "AML.T0048-adjacent (impersonation)"
  status: modeled
  grounding: ["AP2 spec (github.com/google-agentic-commerce/AP2), Merchant object has no certificate/PKI binding"]
  simulated_by: []
  detected_by: ["janus.defend.hard_rules.evaluate_checkout (merchant allow-list check)"]

- id: D16
  category: D
  category_name: "Agentic Commerce Fraud"
  name: "Adversarial Listing Manipulation"
  mechanism: >
    GenAI-crafted product listings and reviews engineered specifically to
    manipulate an autonomous purchasing agent's decision logic, biasing
    product selection via fake authority/safety framing (Branded Whisper),
    inflating quantity via a fake fulfillment-unit directive (Cart
    Inflation), or spoofing the confirmed price via injected structured
    data (Currency/Locale Confusion).
  rails: [agentic_token]
  channels: [ap2_ucp_sandbox]
  actors: [malicious_merchant]
  precursor_signals: ["catalog description containing an authority/urgency keyword cluster or an embedded structured-data price/quantity directive"]
  observable_features: ["content-classifier score", "extracted quantity/price directive presence"]
  atlas_mapping: "AML.T0051 (indirect prompt injection)"
  status: simulated
  grounding: ["Independently derived from this repo's own adaptive red-team campaigns against the AP2 sandbox"]
  simulated_by:
    - "janus.generate.agentic.red_team (branded_whisper, cart_inflation, currency_locale_confusion)"
  detected_by:
    - "janus.defend.hard_rules (checkout constraints, purchase-summary amount check)"
    - "janus.defend.nlp.InjectionTextClassifier"

- id: D17
  category: D
  category_name: "Agentic Commerce Fraud"
  name: "Agent Token Theft & Replay"
  mechanism: >
    A leaked or misdirected agent payment credential is used by a party
    other than the authenticated session, modeled here as the Vault
    Whisper mechanism: injected content persuades the agent to pass a
    foreign account_ref to the Credentials Provider, a payments-domain
    instance of a standard broken-object-level-authorization (BOLA)
    pattern (OWASP API1:2023).
  rails: [agentic_token]
  channels: [ap2_ucp_sandbox]
  actors: [fraud_ring]
  precursor_signals: ["account_ref present and not equal to the authenticated session's user_id"]
  observable_features: ["account_ref hard-rule verdict"]
  atlas_mapping: "AML.T0086 (adjacent, credential misuse)"
  status: simulated
  grounding: ["arXiv:2601.22569, \"Whispers of Wealth\", cross-account data leak via credential-provider interaction, reproduced here at 100% against a naive baseline"]
  simulated_by: ["janus.generate.agentic.red_team (vault_whisper)"]
  detected_by: ["janus.defend.hard_rules.evaluate_account_ref"]
