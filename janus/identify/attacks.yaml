# Project JANUS Attack Atlas, 17 attack vectors across 4 categories.
#
# status is honest per-attack, derived from what actually runs in this
# repo, not aspirational:
#   simulated; a generator produces synthetic instances AND a defend
#                    family is trained/evaluated against them, with real
#                    measured numbers persisted to data/processed/.
#   modeled: grounded taxonomy entry with a specific, named
#                    structural mechanism and citation, and at least a
#                    partial hook in the sandbox/rules (e.g. a related
#                    hard rule or scenario), but no dedicated end-to-end
#                    generator+detector pair.
#   taxonomy_only: researched and documented, no simulation or detection
#                    built in this repo.
#
# simulated_by / detected_by reference concrete module paths so the Atlas
# UI's coverage claim is derived from this file, not asserted separately.

- id: A1
  category: A
  category_name: "Identity & Onboarding Fraud"
  name: "Synthetic Identity Fraud 2.0"
  mechanism: >
    LLM-generated fake identities with internally consistent synthetic
    credit histories; diffusion-generated selfies matched to fabricated ID
    documents, defeating document+selfie cross-checks at account opening.
  rails: [card, aba]
  channels: [online_onboarding]
  actors: [fraud_ring]
  precursor_signals: ["thin/zero prior credit history with implausibly complete profile", "device/IP reuse across many new applications"]
  observable_features: ["application-velocity per device fingerprint", "profile-completeness vs. credit-file-age mismatch", "machine-speed form completion with few corrections", "declared income unsupported by the rest of the application"]
  atlas_mapping: null
  status: simulated
  grounding: ["Datos Insights, Cyber-fraud integration for the new age of risk (2025)"]
  simulated_by: ["janus.generate.identity.synthetic_identity.generate_onboarding_population (cheap / moderate / advanced ring sophistication tiers)"]
  detected_by: ["janus.generate.identity.synthetic_identity.train_onboarding_detector"]

