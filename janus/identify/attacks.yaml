- id: B6
  category: B
  category_name: "Social-Engineering & Authorization Fraud"
  name: "Deepfake \"Emergency\" Voice/Video Scams"
  mechanism: >
    Cloned voice/video of a family member or executive used to authorize
    an urgent push payment. Deliberately does not generate or detect
    audio; the downstream transaction fingerprint (first-time
    beneficiary, population-atypical amount, off-hours timing, channel
    switch) is what's modeled and detected instead.
  rails: [instant_rail]
  channels: [phone, video_call]
  actors: [fraud_ring]
  precursor_signals: ["first-time beneficiary", "off-hours timing", "amount in the upper half of the type's real fraud range"]
  observable_features: ["amount_percentile_within_type", "hour_of_day", "is_off_hours", "channel_switch"]
  atlas_mapping: null
  status: simulated
  grounding: ["Mastercard Scam Protect public materials; APP fraud projected to reach $15B by 2028 in the US (Recorded Future)"]
  simulated_by: ["janus.generate.sequence.voice_scam.inject_voice_scam_transactions"]
  detected_by: ["janus.generate.sequence.voice_scam.train_voice_scam_detector"]

