- id: C10
  category: C
  category_name: "Transaction & Network-Level Attacks"
  name: "LLM-Automated Card Testing (\"Carding Bots\")"
  mechanism: >
    Agents that iterate BIN ranges and mutate transaction parameters,
    adapting to declines to evade velocity checks, a rapid burst of
    small, varied-amount authorization attempts with a high decline rate
    and no human-plausible pacing.
  rails: [card]
  channels: [card_not_present]
  actors: [fraud_ring, bot]
  precursor_signals: ["burst of >15 auth attempts against one card within a tight window, high decline rate, stepping amounts"]
  observable_features: ["event sequence: auth_declined/auth_approved cadence", "amount stepping pattern"]
  atlas_mapping: "AML.T0015 (adjacent, automated probing)"
  status: simulated
  grounding: ["standard carding-bot pattern, well-documented in issuer risk literature"]
  simulated_by: ["janus.generate.sequence.simulator.simulate_population (card_testing_bot behavior)"]
  detected_by: ["janus.defend.sequence.train_sequence_transformer"]

- id: C11
  category: C
  category_name: "Transaction & Network-Level Attacks"
  name: "Adversarial Evasion of Scoring Models"
  mechanism: >
    Minimally-perturbed fraud transactions crafted via black-box
    query-based search to slip under a deployed model's decision
    threshold, without changing the underlying fraudulent intent.
  rails: [card]
  channels: [card_not_present, card_present]
  actors: [fraud_ring]
  precursor_signals: ["transaction narrowly below the model's decision threshold on features known to be attacker-observable"]
  observable_features: []
  atlas_mapping: "AML.T0043 (Craft Adversarial Data)"
  status: simulated
  grounding: ["Kantchelian et al. 2016, Evasion and Hardening of Tree Ensemble Classifiers"]
  simulated_by: ["janus.generate.adversarial.evasion.greedy_evade"]
  detected_by: ["janus.generate.adversarial.evasion.iterative_harden (adversarially-retrained janus.defend.gbm)"]

- id: C12
  category: C
  category_name: "Transaction & Network-Level Attacks"
  name: "Synthetic Mule-Network Orchestration"
  mechanism: >
    AI-coordinated fan-in (many sources -> one mule account) followed by
    fan-out (one mule -> many sinks) within a tight time window, skimming
    a cut before forwarding; structuring designed to stay under
    single-hop velocity thresholds while moving funds in aggregate.
  rails: [instant_rail]
  channels: [mobile_money, bank_transfer]
  actors: [fraud_ring, mule]
  precursor_signals: ["fan-in count 6-18 within a 2-step window followed by fan-out within 1-4 steps"]
  observable_features: ["in_n_unique_counterparties", "flow_ratio", "time_to_first_outflow"]
  atlas_mapping: "AML.T0048-adjacent (network-level coordination)"
  status: simulated
  grounding: ["PaySim structuring/smurfing literature; RBI/UPI instant-rail hosting context"]
  simulated_by: ["janus.generate.graph.mule_ring.inject_mule_rings"]
  detected_by: ["janus.generate.graph.detect.train_mule_detector"]

