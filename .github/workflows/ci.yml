name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -v

      - name: Verify every module imports cleanly
        run: |
          python -c "
          import importlib, sys
          mods = [
              'janus.common.schemas', 'janus.common.llm', 'janus.common.crypto', 'janus.common.mandate_rules', 'janus.common.metrics', 'janus.common.paths',
              'janus.identify.atlas', 'janus.identify.agent',
              'janus.generate.agentic.catalog', 'janus.generate.agentic.credentials_provider', 'janus.generate.agentic.shopping_agent', 'janus.generate.agentic.scenarios',
              'janus.generate.agentic.red_team', 'janus.generate.agentic.divergence', 'janus.generate.agentic.policies', 'janus.generate.agentic.corpus',
              'janus.generate.graph.mule_ring', 'janus.generate.graph.detect', 'janus.generate.graph.generalization_check',
              'janus.generate.sequence.voice_scam', 'janus.generate.sequence.simulator',
              'janus.generate.tabular.synthesizer',
              'janus.generate.fidelity.distributional', 'janus.generate.fidelity.scorer',
              'janus.generate.adversarial.evasion',
              'janus.defend.hard_rules', 'janus.defend.nlp', 'janus.defend.firewall',
              'janus.defend.gbm', 'janus.defend.gnn', 'janus.defend.sequence', 'janus.defend.anomaly', 'janus.defend.meta', 'janus.defend.explain',
              'janus.data.download', 'janus.data.load',
              'janus.orchestrate.loop', 'janus.orchestrate.persist',
              'backend.app.main',
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  failed.append((m, str(e)))
          print(f'{len(mods)-len(failed)}/{len(mods)} imported OK')
          for m, e in failed:
              print(f'FAILED: {m}: {e}')
          sys.exit(1 if failed else 0)
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build
